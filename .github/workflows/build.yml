name: Build Windows packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check English coverage and browser routing
        shell: pwsh
        run: |
          node scripts/localization.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Translation check failed' }
          node browser-extension/test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed' }
      - name: Build Korean and English packages
        shell: pwsh
        run: |
          $version = '0.3.0-beta.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          ./scripts/package.ps1 -Version $version
      - name: Test local translation protocols and cancellation
        shell: pwsh
        run: |
          foreach ($language in @('ko','en')) {
            $binary = Get-ChildItem artifacts -Filter MiniDeck.exe -Recurse | Where-Object { $_.Directory.Name -like "MiniDeck-*-win-$language" } | Select-Object -First 1
            if (!$binary) { throw "Missing $language test executable" }
            $output = Join-Path $PWD "artifacts/translation-tests-$language"
            $process = Start-Process -FilePath $binary.FullName -ArgumentList @('--translation-test', "`"$output`"") -PassThru
            if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Translation tests timed out' }
            Get-Content (Join-Path $output 'translation-tests.txt')
            if ($process.ExitCode -ne 0) { throw "Translation tests failed ($language)" }
            $process = Start-Process -FilePath $binary.FullName -ArgumentList @('--translation-ui-test', "`"$output`"") -PassThru
            if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Translation UI tests timed out' }
            Get-Content (Join-Path $output 'translation-ui-tests.txt')
            if ($process.ExitCode -ne 0) { throw "Translation UI tests failed ($language)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MiniDeck-windows-ko-en
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MiniDeck-windows-ko-en
          path: dist
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "MiniDeck $RELEASE_TAG" --notes-file .github/release-notes.md

